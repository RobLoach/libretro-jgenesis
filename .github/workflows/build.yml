name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: i686
            target: i686-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
          - arch: armv7
            target: armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: make -f Makefile.libretro platform=unix ARCH=${{ matrix.arch }} CARGO_BUILD=zigbuild GLIBC=2.28
      - run: file jgenesis_libretro.so
      - uses: actions/upload-artifact@v4
        with:
          name: jgenesis_libretro-linux-${{ matrix.arch }}
          path: jgenesis_libretro.so

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.arch }}-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}-pc-windows-msvc
      - run: make -f Makefile.libretro platform=windows_msvc ARCH=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: jgenesis_libretro-windows-${{ matrix.arch }}
          path: jgenesis_libretro.dll

  apple:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            make_args: platform=osx ARCH=x86_64
            target: x86_64-apple-darwin
            output: jgenesis_libretro.dylib
            artifact: macos-x86_64
          - name: macOS arm64
            make_args: platform=osx ARCH=arm64
            target: aarch64-apple-darwin
            output: jgenesis_libretro.dylib
            artifact: macos-arm64
          - name: iOS arm64
            make_args: platform=ios-arm64
            target: aarch64-apple-ios
            output: jgenesis_libretro_ios.dylib
            artifact: ios-arm64
          - name: tvOS arm64
            make_args: platform=tvos-arm64
            target: aarch64-apple-tvos
            output: jgenesis_libretro_tvos.dylib
            artifact: tvos-arm64
            nightly: true
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !matrix.nightly }}
        run: rustup target add ${{ matrix.target }}
      - if: ${{ matrix.nightly }}
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: make -f Makefile.libretro ${{ matrix.make_args }}
      - run: file ${{ matrix.output }}
      - uses: actions/upload-artifact@v4
        with:
          name: jgenesis_libretro-${{ matrix.artifact }}
          path: ${{ matrix.output }}

  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86
            target: i686-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Build through the ndk-build shim, the same way libretro's android-jni template does
      - run: $ANDROID_NDK_LATEST_HOME/ndk-build APP_ABI=${{ matrix.abi }}
      - run: |
          cp libs/${{ matrix.abi }}/libretro.so jgenesis_libretro_android.so
          file jgenesis_libretro_android.so
      - uses: actions/upload-artifact@v4
        with:
          name: jgenesis_libretro-android-${{ matrix.abi }}
          path: jgenesis_libretro_android.so

  emscripten:
    name: Emscripten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - run: rustup target add wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-emscripten
      - run: make -f Makefile.libretro platform=emscripten
      - uses: actions/upload-artifact@v4
        with:
          name: jgenesis_libretro-emscripten
          path: jgenesis_libretro_emscripten.a
